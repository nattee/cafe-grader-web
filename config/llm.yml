# LLM configuration. The shared `llm_services` anchor below is merged into
# every environment block; that's how the keys actually get loaded by
# `Rails.application.config_for(:llm)`. Keys placed at the top level (outside
# the anchor) are ignored.
#
# Two kinds of keys live in the anchor:
#
# 1) Per-model service registrations — `<ClassName>: <comma-separated models>`.
#    The cafe_grader initializer reads these and builds
#    Rails.configuration.llm[:provider] so that lookups like
#    `provider["gemini-2.5-pro"].constantize` resolve to `Llm::GenieAssist`.
#    See config/initializers/cafe_grader.rb.
#
# 2) Direct viva-service overrides — `viva_turn_service` / `viva_grade_service`.
#    These name a concrete subclass of Llm::VivaTurnAssist / Llm::VivaGradeAssist
#    that the matching job will instantiate. On master both are unset, so the
#    abstract bases raise NotImplementedError at call time (intentional). On
#    chula_cp they point at Llm::VivaTurnGenieAssist / Llm::VivaGradeGenieAssist.
#
#    `grounding_extract_service` follows the same pattern (design D4): it
#    names a concrete subclass of Llm::GroundingExtractAssist that
#    Llm::GroundingExtractJob instantiates. Blank on master; a deployment
#    branch wires e.g. Llm::GroundingExtractGenieAssist.

llm_services: &services
  # Per-model service registrations
  # ChatGPTAssist: ChatGPT-4o,ChatGPT-o3
  GenieAssist: gemini-3.1-pro,Claude-Sonnet

  # as of 23 Aug 2026, the list_model method gives
  # ["gemini-2.5-flash-lite", "gemini-2.5-flash", "gemini-2.0-flash-lite", "gemini-2.0-flash",
  #  "gpt-4o-mini", "gemini-3.1-flash-lite", "gemini-3-flash", "Claude-Sonnet", "Claude-Haiku",
  #  "gemini-2.5-pro", "gemini-3.1-pro"]
  # (gemini-3.1-pro is served as gemini-3.1-pro-preview; it is a reasoning model)

  # Direct viva service overrides
  viva_turn_service:  Llm::VivaTurnGenieAssist
  viva_grade_service: Llm::VivaGradeGenieAssist
  grounding_extract_service: Llm::GroundingExtractGenieAssist

  # --- Near-Miss Grading / self-hosted providers (blank on master; real
  #     values live on chula_cp, same convention as the viva keys) ---

  # Concrete Llm::SubmissionRepairAssist subclass used by SubmissionRepairJob.
  submission_repair_service: Llm::SubmissionRepairSelfHostAssist

  # Registry of self-hosted OpenAI-compatible endpoints. Keys are operator
  # labels (model identity is config data, never code). max_tokens: reasoning
  # models spend completion budget on thinking — 4096 yields empty content on
  # repair-sized prompts (pilot-verified: finish_reason=length); 16384 for
  # the DGX reasoning residents (gemma is not one). The three DGX ports are
  # swap slots — at most one is alive; a dead port refuses TCP, which the
  # transport treats as a clean retryable error.
  # DO NOT register SelfHostAssist in the assist picker yet: its
  # comment-assist prompt still sends the statement PDF, which sglang/vLLM
  # reject with 400 (blocked on problems.statement_text — doc/backlog.md).
  self_hosted_default: qwen
  self_hosted_models:
    qwen:  { base_url: "http://161.200.93.200:8000", completion_path: "/v1/chat/completions", model: "qwen3.5",     max_tokens: 16384 }
    glm:   { base_url: "http://161.200.93.200:8001", completion_path: "/v1/chat/completions", model: "glm-5.2",     max_tokens: 16384 }
    kimi:  { base_url: "http://161.200.93.200:8002", completion_path: "/v1/chat/completions", model: "kimi-k2.6",   max_tokens: 16384 }
    gemma: { base_url: "http://10.0.5.25:8000",      completion_path: "/v1/chat/completions", model: "gemma-4-31b", max_tokens: 4096 }

development:
  <<: *services

production:
  <<: *services

test:
  <<: *services
