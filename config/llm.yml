# LLM configuration. The shared `llm_services` anchor below is merged into
# every environment block; that's how the keys actually get loaded by
# `Rails.application.config_for(:llm)`. Keys placed at the top level (outside
# the anchor) are ignored.
#
# Two kinds of keys live in the anchor:
#
# 1) Per-model service registrations — `<ClassName>: <comma-separated models>`.
#    The cafe_grader initializer reads these and builds
#    Rails.configuration.llm[:provider] so that lookups like
#    `provider["gemini-2.5-pro"].constantize` resolve to `Llm::GenieAssist`.
#    See config/initializers/cafe_grader.rb.
#
# 2) Direct viva-service overrides — `viva_turn_service` / `viva_grade_service`.
#    These name a concrete subclass of Llm::VivaTurnAssist / Llm::VivaGradeAssist
#    that the matching job will instantiate. On master both are unset, so the
#    abstract bases raise NotImplementedError at call time (intentional). On
#    chula_cp they point at Llm::VivaTurnGenieAssist / Llm::VivaGradeGenieAssist.
#
#    `grounding_extract_service` follows the same pattern (design D4): it
#    names a concrete subclass of Llm::GroundingExtractAssist that
#    Llm::GroundingExtractJob instantiates. Blank on master; a deployment
#    branch wires e.g. Llm::GroundingExtractGenieAssist.

llm_services: &services
  # Per-model service registrations
  # ChatGPTAssist: ChatGPT-4o,ChatGPT-o3
  # GenieAssist: gemini-2.5-pro,Claude-3.5-Sonnet

  # Direct viva service overrides (leave blank on master)
  viva_turn_service:
  viva_grade_service:
  grounding_extract_service:

  # --- Near-Miss Grading / self-hosted providers (blank on master; real
  #     values live on chula_cp, same convention as the viva keys) ---

  # Concrete Llm::SubmissionRepairAssist subclass used by SubmissionRepairJob.
  # chula_cp sets: Llm::SubmissionRepairSelfHostAssist
  submission_repair_service:

  # Registry of self-hosted OpenAI-compatible endpoints. Keys are operator
  # labels (model identity is config data, never code). chula_cp example:
  #   self_hosted_default: qwen
  #   self_hosted_models:
  #     qwen:  { base_url: "http://<dgx>:8000",  completion_path: "/v1/chat/completions", model: "qwen3.5",     max_tokens: 4096 }
  #     glm:   { base_url: "http://<dgx>:8001",  completion_path: "/v1/chat/completions", model: "glm-5.2",     max_tokens: 4096 }
  #     kimi:  { base_url: "http://<dgx>:8002",  completion_path: "/v1/chat/completions", model: "kimi-k2.6",   max_tokens: 4096 }
  #     gemma: { base_url: "http://<a100>:8000", completion_path: "/v1/chat/completions", model: "gemma-4-31b", max_tokens: 4096 }
  # To expose them in the submission-assist picker, also register the served
  # names:  SelfHostAssist: qwen3.5,gemma-4-31b
  self_hosted_default:
  self_hosted_models:

development:
  <<: *services

production:
  <<: *services

test:
  <<: *services
