default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  # Two workers, two queues: viva (interview turns + grading) is isolated from
  # default (assists, PDF, stats, housekeeping) so an assist flood can't starve
  # a student mid-interview (2026-09-09 exam). The two names are exhaustive —
  # never use "*" for the second worker, it would drain viva too.
  #
  # Sizing: the numbers below are the DEFAULTS for every host. Change a default
  # here. To deviate on ONE host, set VIVA_JOB_THREADS / JOB_THREADS in that
  # host's config/solid_queue.env (see .SAMPLE) and never restate a default
  # there. Keep threads <= DB pool - 1 (RAILS_MAX_THREADS in database.yml):
  # each worker needs one connection per thread plus one for polling. The
  # effective values a host really runs are on Manage -> Grader Processes.
  workers:
    - queues: "viva"
      threads: <%= ENV.fetch("VIVA_JOB_THREADS", 3) %>
      processes: 1
      polling_interval: 0.1
    # Everything else: assists, PDF, problem stats, recurring housekeeping.
    - queues: "default"
      threads: <%= ENV.fetch("JOB_THREADS", 3) %>
      processes: 1
      polling_interval: 0.1
  recurring:
    refresh_problem_stats:
      class: RefreshProblemStatsJob
      schedule: every hour

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
